cv:
  name: Muhammad Hamza
  label: Ph.D. Candidate, Peking University | CFD / FSI Simulation & Embedded Sensing
  website: https://hamzasherpao.github.io
  summary: >-
    Ph.D. candidate at Peking University (expected 2027) working at the intersection of fluid-structure simulation and embedded sensing, with 3+ years of prior industry R&D experience as a CFD/CAE engineer in aerospace, renewable energy, and fluid machinery.
    On the simulation side, I specialize in aerodynamic and hydrodynamic shape optimization, FSI and FEM analysis, and surrogate-based design optimization.
    On the sensing side, I develop embedded piezoelectric (PVDF) sensing for soft bodies in flow, from signal-conditioning hardware and synchronized data acquisition to machine-learning estimation of body shape, flow conditions, and position, deployed in real time in water-channel tests.

  address:
    city: Beijing
    region: China

  sections:
    Education:
      - institution: Peking University
        location: Beijing, China
        area: General Mechanics and Foundation of Mechanics
        studyType: Ph.D.
        start_date: 2023
        highlights:
          - "Supervisor: Prof. Guangming Xie. Chinese Government Scholarship."
          - "Research: bio-inspired soft bodies in flow, covering energy harvesting, proprioception, upstream body localization, and flow sensing with embedded PVDF signals."
          - Combines CFD optimization, FSI simulation, and water-channel experiments with machine-learning interpretation of sensor signals.

      - institution: Xi'an Jiaotong University
        location: Xi'an, China
        area: Mechanics
        studyType: M.S.
        start_date: 2019
        end_date: 2021
        highlights:
          - "Supervisor: Prof. Yang Zhang. Chinese Government Scholarship."
          - "Thesis: discrete adjoint method for aerodynamic shape optimization of the ONERA M6 wing and NREL S809 vortex generators (ANSYS Fluent, ANSYS ICEM)."

      - institution: Institute of Space Technology
        location: Islamabad, Pakistan
        area: Aerospace Engineering
        studyType: B.S.
        start_date: 2014
        end_date: 2018
        highlights:
          - "Thesis: design, fabrication, and flight testing of a tube-launched micro aerial vehicle with retractable wings."

    Experience:
      - company: Max Planck Institute of Animal Behavior
        position: Visiting Researcher
        location: Konstanz, Germany
        start_date: 2024
        end_date: 2024
        highlights:
          - Ran immersed-boundary CFD simulations of 3D fish bodies in IBAMR, with grid-independence studies.
          - Re-engineered the IBAMR kinematics handling to interpolate prescribed body velocities to finer timesteps inside the solver (C++).
          - Wrote surface-probe extraction routines that cut data read time by up to 60% and output file size by up to 70%.

      - company: TenFong (Zhejiang) Technology Co., Ltd.
        position: CAE Engineer, R&D
        location: Zhejiang, China
        start_date: 2022
        end_date: 2023
        highlights:
          - Aerodynamic and hydrodynamic CFD analyses (Star-CCM+, ANSYS Fluent) for wind energy, water pump, and urban development projects.
          - FSI analysis of water pump assemblies in Star-CCM+, identifying geometry changes that reduced internal pressure losses.
          - Transient two-phase VOF simulation of molten-iron pouring in OpenFOAM (interFoam).

      - company: Wanhu Aerospace Industry Co., Ltd.
        position: Aero Engineer, R&D
        location: China
        start_date: 2021
        end_date: 2022
        highlights:
          - Full-aircraft RANS simulations of a FAR-23 general aviation aircraft (ANSYS ICEM, Fluent, CFD-Post) for flight envelope assessment.
          - Composite layup stress analysis and flight loads analysis in Femap/Nastran to support FAR-23 certification.

      - company: H&A Bots (Pvt.) Ltd.
        position: Aero Engineer
        location: Islamabad, Pakistan
        start_date: 2018
        end_date: 2019
        highlights:
          - CFD and structural simulations for the conceptual design of aerospace products.
          - 1D system performance models in MATLAB for early-stage trade studies.

